<section>
  <div class="separator" style="border: 0.5px solid #FAB716;"></div>
  <h3 style="color: #FAB716;">Unisciti a noi</h3>
  <h4>Costruiamo un futuro insieme</h4>
  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <label for="name">Name:</label>
    <input id="name" formControlName="name" required />

    <label for="email">Email:</label>
    <input id="email" type="email" formControlName="email" required />

    <label for="message">Message:</label>
    <textarea id="message" formControlName="message" required></textarea>

    <button type="submit" [disabled]="!contactForm.valid">Send</button>
  </form>

  <div *ngIf="responseMessage">{{ responseMessage }}</div>

</section>
