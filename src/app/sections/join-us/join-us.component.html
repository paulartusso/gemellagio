<section>
  <div class="separator" style="border: 0.5px solid #FAB716; margin: 0;"></div>
  <h3 class="h3" style="color: #FAB716;">Unisciti a noi</h3>
  <h4 style="margin-bottom: 30px;">
    Costruiamo un futuro insieme, consulta le posizioni aperte e inviaci il tuo curriculum
  </h4>

  <div class="main">
    <div style="display: flex; justify-content: center; align-items: center;">
      <div style="margin-top: 30px; width: 80%; position: relative;">
        <button *ngIf="showCarousel" (click)="showAllOffers()" class="full-offer-button">
          Vedi tutte le Offerte <i class="material-icons">arrow_back_ios_new</i>
        </button>
      </div>
    </div>
    <div *ngIf="showCarousel">
      <div class="carousel-position">
        <div #carousel class="carousel-container">
          <div class="carousel-track">
            <div *ngFor="let job of jobsList" class="carousel-item">
              <app-job-card [role]="job.role" [company]="job.company" [location]="job.location"
                [description]="job.description" [seniority]="job.seniority" [contract]="job.contract_type"
                [ral]="job.ral" [frontend_tech]="job.frontend_tech" [backend_tech]="job.backend_tech"
                [devops_tech]="job.devops_tech" [db_tech]="job.db_tech">
              </app-job-card>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Full offers no carousel -->
    <div *ngIf="showOffers">
      <div style="display: flex; justify-content: center; width: 100%;">
        <div class="back-input-container">
          <div class="input-container">
            <button *ngIf="showOffers" (click)="backToCarousel()" class="back-button"><i
                class="material-icons">arrow_back_ios_new</i></button>
            <div>
              <img src="../../../assets/img/search.png" alt="" width="20px">
              <input [(ngModel)]="searchQuery" (input)="filterJobs()" type="text" class="search-bar"
                placeholder="Cerca per ruolo o locazione">
            </div>
          </div>
        </div>
      </div>
      <div class="carousel-position">
        <div class="cards-container">
          <div *ngFor="let job of filteredJobs">
            <app-job-card [id]="job.id" [role]="job.role" [company]="job.company" [location]="job.location"
              [description]="job.description" [seniority]="job.seniority" [contract]="job.contract_type" [ral]="job.ral"
              [frontend_tech]="job.frontend_tech" [backend_tech]="job.backend_tech" [devops_tech]="job.devops_tech"
              [db_tech]="job.db_tech" [cardIsOpen]="showOffers" [apply]="jobApplication">
            </app-job-card>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>
