<header class="page-header container">
  <span class="eyebrow">{{ 'NAV.MEDIA' | translate }}</span>
  <h1>{{ 'MEDIA.TITLE' | translate }}</h1>
  <p class="lead">{{ 'MEDIA.SUBTITLE' | translate }}</p>
  <div class="town-band"><span></span></div>
</header>

<section class="container articles">
  <article *ngFor="let article of articles" class="article" appScrollAnimation="bottom">
    <a class="thumb" [routerLink]="['/media/full-article', article.id]" tabindex="-1" aria-hidden="true">
      <img [src]="article.image" alt="" loading="lazy" width="640" height="480">
    </a>
    <div class="body">
      <span class="badge" [ngClass]="'badge--' + article.country">{{ 'MEDIA.COUNTRY.' + article.country | translate }}</span>
      <h2>
        <a [routerLink]="['/media/full-article', article.id]">{{ article.key + '.TITLE' | translate }}</a>
      </h2>
      <p class="excerpt">{{ article.key + '.BODY' | translate }}</p>
      <span class="read-more" aria-hidden="true">{{ 'MEDIA.READ_MORE' | translate }} →</span>
    </div>
  </article>
</section>
