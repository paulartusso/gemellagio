<section class="section where">
  <div class="container">
    <header class="where-header">
      <span class="eyebrow">{{ 'WHERE_WE_ARE.EYEBROW' | translate }}</span>
      <h2 class="section-title">{{ 'WHERE_WE_ARE.TITLE' | translate: { city: homeCity.name } }}</h2>
      <p class="lead">{{ 'WHERE_WE_ARE.LEAD' | translate }}</p>
    </header>

    <div class="where-grid">
      <figure class="map">
        <img [src]="mapImage" width="1000" height="800" loading="lazy"
          [alt]="'WHERE_WE_ARE.MAP_ALT' | translate: { city: homeCity.name }">
      </figure>

      <dl class="stats">
        <div class="stat" *ngFor="let d of distances" appScrollAnimation="bottom">
          <dt>{{ 'WHERE_WE_ARE.DISTANCE_TO' | translate: { city: d.toCity.name } }}</dt>
          <dd><span [countUp]="d.km" [locale]="locale"></span><span class="unit">km</span></dd>
        </div>
        <div class="stat" appScrollAnimation="bottom">
          <dt>{{ 'WHERE_WE_ARE.INHABITANTS' | translate: { city: homeCity.name } }}</dt>
          <dd><span [countUp]="homeCity.population" [locale]="locale"></span></dd>
        </div>
      </dl>
    </div>
  </div>
</section>
