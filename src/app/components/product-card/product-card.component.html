<article class="card" appScrollAnimation="bottom">
  <img [src]="product.img" alt="" loading="lazy" width="640" height="480">
  <div class="body">
    <span class="town">{{ product.town }}</span>
    <h2>{{ product.key + '.NAME' | translate }}</h2>
    <ul>
      <li *ngFor="let i of featureIndexes">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        {{ product.key + '.FEATURES.' + i | translate }}
      </li>
    </ul>
  </div>
</article>
