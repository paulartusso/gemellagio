<header class="site-header">
  <div class="town-band town-band--full"><span></span></div>
  <div class="container bar">
    <a routerLink="/home" class="brand" (click)="closeMenu()">
      <img src="assets/emblem.webp" alt="" width="44" height="44">
      <span class="brand-text">
        <span class="brand-name">{{ 'NAV.BRAND' | translate }}</span>
        <span class="brand-towns">Filottrano · Kuppenheim · Raon-l’Étape</span>
      </span>
    </a>

    <nav class="desktop-nav" [attr.aria-label]="'NAV.MAIN' | translate">
      <a *ngFor="let link of links" [routerLink]="link.path" routerLinkActive="active"
        ariaCurrentWhenActive="page">{{ link.label | translate }}</a>
    </nav>

    <div class="actions">
      <ng-container *ngTemplateOutlet="languageSwitch"></ng-container>
      <button type="button" class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen"
        aria-controls="mobile-nav" [attr.aria-label]="(menuOpen ? 'NAV.MENU_CLOSE' : 'NAV.MENU_OPEN') | translate">
        <svg *ngIf="!menuOpen" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <svg *ngIf="menuOpen" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </div>

  <nav id="mobile-nav" class="mobile-nav" *ngIf="menuOpen" [attr.aria-label]="'NAV.MAIN' | translate">
    <div class="container">
      <a *ngFor="let link of links" [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page"
        (click)="closeMenu()">{{ link.label | translate }}</a>
    </div>
  </nav>
</header>

<ng-template #languageSwitch>
  <div class="lang-switch" role="group" [attr.aria-label]="'NAV.LANGUAGE' | translate">
    <button type="button" *ngFor="let lang of languages" (click)="selectLanguage(lang.code)"
      [class.current]="lang.code === currentLang" [attr.aria-pressed]="lang.code === currentLang"
      [attr.lang]="lang.code" [attr.title]="lang.name">
      <span aria-hidden="true">{{ lang.code | uppercase }}</span>
      <span class="visually-hidden">{{ lang.name }}</span>
    </button>
  </div>
</ng-template>
