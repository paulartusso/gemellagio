<div class="menu">
  <span (click)="navigateTo('home')">
    <img src="../../../assets/logo.png" alt="">
  </span>
  <span style="display: flex; flex-direction: row; align-items: center;">
    <div class="desktop-menu">
      <span (click)="navigateTo('home')" [class.active]="currentTab === 'home'">
        About us
      </span>
      <span (click)="navigateTo('services')" [class.active]="currentTab === 'services'">
        Servizi
      </span>
      <span (click)="showStudyCases('desktop')" [class.active]="currentTab === 'case-studies'">
        Case Studies
      </span>
      <span (click)="navigateTo('media')" [class.active]="currentTab === 'media'">
        Media
      </span>
      <span (click)="navigateTo('join-us')" [class.active]="currentTab === 'join-us'">
        Carriera
      </span>
      <span (click)="navigateTo('contacts')" [class.active]="currentTab === 'contacts'">
        Contatti
      </span>
    </div>
    <div class="language-wrapper">
      <div class="selected-language" (click)="showLanguages()"></div>
      <div [ngClass]="showLanguageOptions ? 'flags' : 'selector'">
        <div class="flag">
          <img src="../../../assets/img/eng.png" alt="EN" style="width: 15px;">
        </div>
      </div>
    </div>
    <i (click)="showMenu()" class="material-icons hamburguer">menu</i>
  </span>
</div>
<!--MOBILE HIDDEN MENU-->
<div class="links-container">
  <div *ngIf="isShowing" class="hidden-menu">
    <div>
      <span (click)="navigateTo('services')">Servizi</span>
    </div>
    <div>
      <span (click)="showStudyCases('mobile')">Case studies</span>
      <div *ngIf="showMobileCases" class="case-studies-mobile">
        <span (click)="navigateTo('case-studies/cross-channel')">Cross channel</span>
        <span (click)="navigateTo('case-studies/tools-selection')">Selezione degli strumenti</span>
        <span (click)="navigateTo('case-studies/mobility')">Mobilità</span>
      </div>
    </div>
    <div>
      <span (click)="navigateTo('media')">Media</span>
    </div>
    <div>
      <span (click)="navigateTo('join-us')">Carriera</span>
    </div>
    <div>
      <span (click)="navigateTo('contacts')">Contatti</span>
    </div>
  </div>
</div>
<!--STUDY CASES for Desktop-->
<div class="links-container">
  <div *ngIf="showCases && !isShowing" class="hidden-menu">
    <div>
      <span (click)="navigateTo('case-studies/cross-channel')">Cross channel</span>
    </div>
    <div>
      <span (click)="navigateTo('case-studies/tools-selection')">Selezione degli strumenti</span>
    </div>
    <div>
      <span (click)="navigateTo('case-studies/mobility')">Mobilità</span>
    </div>
  </div>
</div>
